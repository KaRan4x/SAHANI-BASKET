ass=\"tbtn\" id=\"btnPng\">\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpath d=\"M7 10l5 5 5-5\"/>\u003cpath d=\"M12 15V3\"/>\u003c/svg>\n        Save image\n      \u003c/button>\n      \u003cbutton class=\"tbtn\" id=\"btnClearItems\">Clear items\u003c/button>\n      \u003cbutton class=\"tbtn\" id=\"btnReset\">Reset\u003c/button>\n      \u003cdiv class=\"popover\" id=\"colorPopover\">\n        \u003cp>Theme colour\u003c/p>\n        \u003cdiv class=\"swatches\" id=\"swatches\">\u003c/div>\n        \u003cdiv class=\"custom-row\">\n          \u003cinput type=\"color\" id=\"customColor\" value=\"#8b0000\">\n          \u003clabel for=\"customColor\">Custom shade\u003c/label>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"page\">\n    \u003cdiv class=\"sheet\" id=\"sheet\">\n      \u003ch2 class=\"shop-name\" id=\"shopName\" contenteditable=\"true\" spellcheck=\"false\">\u003c/h2>\n      \u003cdiv class=\"shop-meta\">\n        \u003cspan class=\"row\" id=\"shopAddress\" contenteditable=\"true\" spellcheck=\"false\">\u003c/span>\n        \u003cspan class=\"id-strip\">\n          \u003cspan>GSTIN: \u003cspan id=\"shopGstin\" contenteditable=\"true\" spellcheck=\"false\">\u003c/span>\u003c/span>\n          \u003cspan>FSSAI: \u003cspan id=\"shopFssai\" contenteditable=\"true\" spellcheck=\"false\">\u003c/span>\u003c/span>\n        \u003c/span>\n        \u003cspan class=\"row\">Call to Order: \u003cspan id=\"shopPhone\" contenteditable=\"true\" spellcheck=\"false\">\u003c/span>\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"ribbon\">RATE LIST\u003c/div>\n      \u003cdiv class=\"legend\">\u003cb>NIL\u003c/b> \u2014 no GST charged &nbsp;\u00b7&nbsp; \u003cb>EXTRA\u003c/b> \u2014 GST charged extra as applicable\u003c/div>\n\n      \u003cdiv id=\"categories\">\u003c/div>\n\n      \u003cbutton class=\"add-category\" id=\"btnAddCategory\">+ Add category\u003c/button>\n\n      \u003cdiv class=\"footer-note\" id=\"footerNote\" contenteditable=\"true\" spellcheck=\"false\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cp class=\"hint\">Tap any text to edit it. Rates, sizes and GST are per item \u2014 use the pill to switch Nil / Extra. Your edits are saved on this device automatically.\u003c/p>\n\n\u003cdiv id=\"printRoot\" aria-hidden=\"true\">\u003c/div>\n\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js\">\u003c/script>\n\u003cscript>\n(function(){\n  \"use strict\";\n\n  var STORAGE_KEY = \"rlm_state_v1\";\n  var uid = (function(){ var n=0; return function(p){ n++; return p+\"_\"+Date.now().toString(36)+n; }; })();\n\n  var ACCENT_PRESETS = [\"#8b0000\",\"#c21f26\",\"#0e7c86\",\"#1857c4\",\"#1f7a4d\",\"#d96a11\",\"#6a2c91\",\"#22252a\"];\n\n  var OLD_DEFAULT_FOOTER = \"Rates subject to change without prior notice.\";\n\n  function defaultState(){\n    return {\n      accent: \"#8b0000\",\n      shop: {\n        name: \"RAJ KUMAR SAHANI\",\n        address: \"79 Uzan Bazar Jahajghat, MG. Road, Guwahati \\u2013 781001\",\n        gstin: \"18CJJPS5297R1ZU\",\n        fssai: \"10319001000593\",\n        phone: \"98642-16591 / 78962-64423\"\n      },\n      footer: \"\",\n      categories: sampleCategories()\n    };\n  }\n  function mk(particulars,size,type,rate){\n    return { id: uid(\"i\"), particulars: particulars, size: size, type: type||\"\", rate: rate, gst: \"nil\" };\n  }\n  function sampleCategories(){\n    function cat(name, rows){\n      return { id: uid(\"c\"), name: name, hasType: true,\n        items: rows.map(function(r){ return mk(r[0], r[1], r[2], r[3]); }) };\n    }\n    return [\n      cat(\"FISH & SEAFOOD\", [\n        [\"Katla Fish\",\"3/4 kg\",\"Fresh\",300], [\"Row Fish\",\"2/3 kg\",\"Fresh\",220],\n        [\"Aari Fish\",\"3/4 kg\",\"Fresh\",600], [\"Local Aari Fish\",\"2/3 kg\",\"Fresh\",800],\n        [\"Chital Fish\",\"4/5 kg\",\"Fresh\",650], [\"Pabda Fish\",\"100 gram\",\"Fresh\",550],\n        [\"Pabda Fish\",\"50 gram\",\"Fresh\",450], [\"Bhetki Fish\",\"3/4 kg\",\"Fresh\",750],\n        [\"Elish\",\"600 gram\",\"Fresh\",900], [\"Elish\",\"1 kg\",\"Fresh\",1180],\n        [\"Basa\",\"80%\",\"Frozen\",350], [\"Basa\",\"60%\",\"Frozen\",280],\n        [\"Prawn 16/20\",\"Per kg\",\"Fresh\",570], [\"Prawn 13/15\",\"Per kg\",\"Fresh\",680],\n        [\"Prawn 8/12\",\"Per kg\",\"Fresh\",800]\n      ]),\n      cat(\"CHICKEN & MUTTON\", [\n        [\"Mutton Curry Cut\",\"Per kg\",\"Fresh\",650], [\"Mutton Boneless\",\"Per kg\",\"Frozen\",700],\n        [\"Mutton Keema\",\"Per kg\",\"Frozen\",650], [\"Whole Chicken\",\"Per kg\",\"Fresh\",240],\n        [\"Chicken Breast Boneless\",\"Per kg\",\"Frozen\",260], [\"Chicken Leg Boneless\",\"Per kg\",\"Frozen\",310],\n        [\"Duck\",\"Per pcs\",\"Fresh\",650], [\"Chicken Sausage\",\"Per kg\",\"Frozen\",300],\n        [\"Chicken Nuggets\",\"Per kg\",\"Frozen\",300]\n      ]),\n      cat(\"VEG & DAIRY\", [\n        [\"French Fry\",\"Per kg\",\"Frozen\",125], [\"Sweet Corn\",\"Per kg\",\"Frozen\",110],\n        [\"Green Peas\",\"Per kg\",\"Frozen\",110], [\"Paneer\",\"Per kg\",\"Fresh\",380],\n        [\"Khoya Mawa\",\"Per kg\",\"Frozen\",360]\n      ])\n    ];\n  }\n\n  function loadState(){\n    try{\n      var raw = localStorage.getItem(STORAGE_KEY);\n      if(raw){\n        var parsed = JSON.parse(raw);\n        // Company details are fixed and should never come back blank, even\n        // if an older saved copy on this device had them cleared out.\n        var fixedShop = defaultState().shop;\n        if(!parsed.shop) parsed.shop = fixedShop;\n        else {\n          [\"name\",\"address\",\"gstin\",\"fssai\",\"phone\"].forEach(function(k){\n            if(!parsed.shop[k]) parsed.shop[k] = fixedShop[k];\n          });\n        }\n        // Older saved copies: move to the new default colour and drop the old\n        // default footer line (the reference rate list has no footer).\n        if(!parsed.accent || parsed.accent.toLowerCase()===\"#c21f26\") parsed.accent = \"#8b0000\";\n        if(parsed.footer === OLD_DEFAULT_FOOTER) parsed.footer = \"\";\n        if(!Array.isArray(parsed.categories)) parsed.categories = [];\n        return parsed;\n      }\n    }catch(e){ /* storage unavailable or corrupt - fall through */ }\n    return defaultState();\n  }\n  function saveState(){\n    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }\n  }\n\n  var state = loadState();\n\n  // ---------- colour helpers ----------\n  function shade(hex, pct){\n    hex = hex.replace(\"#\",\"\");\n    if(hex.length===3){ hex = hex.split(\"\").map(function(c){return c+c;}).join(\"\"); }\n    var num = parseInt(hex,16);\n    var r = (num>>16)&255, g=(num>>8)&255, b=num&255;\n    r = Math.round(r + (pct\u003c0? r : 255-r) * pct);\n    g = Math.round(g + (pct\u003c0? g : 255-g) * pct);\n    b = Math.round(b + (pct\u003c0? b : 255-b) * pct);\n    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));\n    return \"#\" + [r,g,b].map(function(v){ var s=v.toString(16); return s.length===1? \"0\"+s : s; }).join(\"\");\n  }\n  // Alternate-row tint for the printed sheet. The default dark red uses the exact\n  // pink from the reference PDF; other theme colours get a matching light tint.\n  function printTint(hex){\n    return hex.toLowerCase()===\"#8b0000\" ? \"#f5dedd\" : shade(hex,0.87);\n  }\n  function applyAccent(hex){\n    state.accent = hex;\n    document.documentElement.style.setProperty(\"--accent\", hex);\n    document.documentElement.style.setProperty(\"--accent-dark\", shade(hex,-0.35));\n    document.documentElement.style.setProperty(\"--accent-tint\", shade(hex,0.85));\n    document.documentElement.style.setProperty(\"--print-tint\", printTint(hex));\n    renderSwatches();\n    saveState();\n  }\n\n  function renderSwatches(){\n    var wrap = document.getElementById(\"swatches\");\n    wrap.innerHTML = \"\";\n    ACCENT_PRESETS.forEach(function(hex){\n      var b = document.createElement(\"button\");\n      b.className = \"swatch\" + (hex.toLowerCase()===state.accent.toLowerCase() ? \" active\" : \"\");\n      b.style.background = hex;\n      b.title = hex;\n      b.addEventListener(\"click\", function(){ applyAccent(hex); });\n      wrap.appendChild(b);\n    });\n  }\n\n  // ---------- header binding ----------\n  function bindHeader(){\n    document.getElementById(\"shopName\").textContent = state.shop.name;\n    document.getElementById(\"shopAddress\").textContent = state.shop.address;\n    document.getElementById(\"shopGstin\").textContent = state.shop.gstin;\n    document.getElementById(\"shopFssai\").textContent = state.shop.fssai;\n    document.getElementById(\"shopPhone\").textContent = state.shop.phone;\n    document.getElementById(\"footerNote\").textContent = state.footer;\n\n    on(\"shopName\",\"name\"); on(\"shopAddress\",\"address\"); on(\"shopGstin\",\"gstin\");\n    on(\"shopFssai\",\"fssai\"); on(\"shopPhone\",\"phone\");\n    function on(id,key){\n      document.getElementById(id).addEventListener(\"blur\", function(e){\n        state.shop[key] = e.target.textContent.trim(); saveState();\n      });\n    }\n    document.getElementById(\"footerNote\").addEventListener(\"blur\", function(e){\n      state.footer = e.target.textContent.trim(); saveState();\n    });\n  }\n\n  // ---------- rate table rendering ----------\n  function esc(s){\n    return String(s).replace(/&/g,\"&amp;\").replace(/\u003c/g,\"&lt;\").replace(/>/g,\"&gt;\").replace(/\"/g,\"&quot;\");\n  }\n\n  function renderCategories(){\n    var host = document.getElementById(\"categories\");\n    host.innerHTML = \"\";\n    state.categories.forEach(function(cat){\n      var section = document.createElement(\"div\");\n      section.className = \"category\";\n      section.dataset.catId = cat.id;\n\n      var head = document.createElement(\"div\");\n      head.className = \"cat-head\";\n      head.innerHTML =\n        '\u003ch3 class=\"cat-name\" contenteditable=\"true\" spellcheck=\"false\">'+esc(cat.name)+'\u003c/h3>' +\n        '\u003clabel class=\"type-toggle\">\u003cinput type=\"checkbox\" class=\"type-check\" '+(cat.hasType?\"checked\":\"\")+'>Type col\u003c/label>' +\n        '\u003cspan class=\"cat-actions\">\u003cbutton class=\"icon-btn del-cat\" title=\"Delete category\">\u2715\u003c/button>\u003c/span>';\n      section.appendChild(head);\n\n      var scroll = document.createElement(\"div\");\n      scroll.className = \"table-scroll\";\n      var table = document.createElement(\"table\");\n      table.className = \"rate-table\";\n      table.innerHTML =\n        '\u003cthead>\u003ctr>' +\n          '\u003cth>Particulars\u003c/th>\u003cth>Size\u003c/th>' +\n          (cat.hasType? '\u003cth class=\"center\">Type\u003c/th>' : '') +\n          '\u003cth class=\"num\">Rate\u003c/th>\u003cth class=\"center\">GST\u003c/th>\u003cth>\u003c/th>' +\n        '\u003c/tr>\u003c/thead>\u003ctbody>\u003c/tbody>';\n      var tbody = table.querySelector(\"tbody\");\n      cat.items.forEach(function(item){ tbody.appendChild(renderRow(cat, item)); });\n      scroll.appendChild(table);\n      section.appendChild(scroll);\n\n      var addRow = document.createElement(\"div\");\n      addRow.className = \"add-item-row\";\n      addRow.innerHTML = '\u003cbutton class=\"add-item\">+ Add item\u003c/button>';\n      section.appendChild(addRow);\n\n      // events\n      head.querySelector(\".cat-name\").addEventListener(\"blur\", function(e){\n        cat.name = e.target.textContent.trim(); saveState();\n      });\n      head.querySelector(\".type-check\").addEventListener(\"change\", function(e){\n        cat.hasType = e.target.checked; renderCategories(); saveState();\n      });\n      head.querySelector(\".del-cat\").addEventListener(\"click\", function(){\n        if(confirm('Delete the \"'+cat.name+'\" section?')){\n          state.categories = state.categories.filter(function(c){ return c.id!==cat.id; });\n          renderCategories(); saveState();\n        }\n      });\n      addRow.querySelector(\".add-item\").addEventListener(\"click\", function(){\n        cat.items.push(mk(\"New item\",\"Per kg\", cat.hasType? \"Fresh\":\"\", 0));\n        renderCategories(); saveState();\n        var lastInput = section.querySelector(\"tbody tr:last-child .particulars-input\");\n        if(lastInput){ lastInput.focus(); lastInput.select(); }\n      });\n\n      host.appendChild(section);\n    });\n  }\n\n  function renderRow(cat, item){\n    var tr = document.createElement(\"tr\");\n    tr.dataset.itemId = item.id;\n\n    var tdP = document.createElement(\"td\");\n    tdP.innerHTML = '\u003cinput class=\"cell-input particulars-input\" type=\"text\" value=\"'+esc(item.particulars)+'\">';\n    tr.appendChild(tdP);\n\n    var tdS = document.createElement(\"td\");\n    tdS.innerHTML = '\u003cinput class=\"cell-input\" type=\"text\" value=\"'+esc(item.size)+'\" style=\"width:64px\">';\n    tr.appendChild(tdS);\n\n    if(cat.hasType){\n      var tdT = document.createElement(\"td\");\n      tdT.className = \"center\";\n      tdT.innerHTML =\n        '\u003cselect class=\"cell-input type-select\">' +\n          '\u003coption value=\"\"'+(item.type===\"\"?\" selected\":\"\")+'>\u2013\u003c/option>' +\n          '\u003coption value=\"Fresh\"'+(item.type===\"Fresh\"?\" selected\":\"\")+'>Fresh\u003c/option>' +\n          '\u003coption value=\"Frozen\"'+(item.type===\"Frozen\"?\" selected\":\"\")+'>Frozen\u003c/option>' +\n        '\u003c/select>';\n      tr.appendChild(tdT);\n    }\n\n    var tdR = document.createElement(\"td\");\n    tdR.className = \"num\";\n    tdR.innerHTML = '\u003cdiv class=\"rate-cell\">\u003cspan class=\"cur\">\u20b9\u003c/span>\u003cinput class=\"cell-input rate-input\" type=\"number\" step=\"0.1\" value=\"'+esc(item.rate)+'\">\u003c/div>';\n    tr.appendChild(tdR);\n\n    var tdG = document.createElement(\"td\");\n    tdG.className = \"center\";\n    tdG.innerHTML = '\u003cbutton class=\"gst-pill '+(item.gst===\"extra\"?\"extra\":\"nil\")+'\">'+(item.gst===\"extra\"?\"EXTRA\":\"NIL\")+'\u003c/button>';\n    tr.appendChild(tdG);\n\n    var tdX = document.createElement(\"td\");\n    tdX.innerHTML = '\u003cbutton class=\"row-del\" title=\"Delete row\">\u2715\u003c/button>';\n    tr.appendChild(tdX);\n\n    tdP.querySelector(\"input\").addEventListener(\"input\", function(e){ item.particulars = e.target.value; saveState(); });\n    tdS.querySelector(\"input\").addEventListener(\"input\", function(e){ item.size = e.target.value; saveState(); });\n    if(cat.hasType){\n      tdT.querySelector(\"select\").addEventListener(\"change\", function(e){ item.type = e.target.value; saveState(); });\n    }\n    tdR.querySelector(\"input\").addEventListener(\"input\", function(e){ item.rate = e.target.value; saveState(); });\n    tdG.querySelector(\"button\").addEventListener(\"click\", function(e){\n      item.gst = item.gst===\"extra\" ? \"nil\" : \"extra\";\n      e.target.className = \"gst-pill \" + item.gst;\n      e.target.textContent = item.gst===\"extra\" ? \"EXTRA\" : \"NIL\";\n      saveState();\n    });\n    tdX.querySelector(\"button\").addEventListener(\"click\", function(){\n      cat.items = cat.items.filter(function(i){ return i.id!==item.id; });\n      renderCategories(); saveState();\n    });\n\n    return tr;\n  }\n\n  // ---------- toolbar actions ----------\n  document.getElementById(\"btnAddCategory\").addEventListener(\"click\", function(){\n    state.categories.push({ id: uid(\"c\"), name: \"NEW SECTION\", hasType: true, items: [ mk(\"New item\",\"Per kg\",\"Fresh\",0) ] });\n    renderCategories(); saveState();\n  });\n\n  var colorBtn = document.getElementById(\"btnColor\");\n  var colorPop = document.getElementById(\"colorPopover\");\n  colorBtn.addEventListener(\"click\", function(){ colorPop.classList.toggle(\"open\"); });\n  document.addEventListener(\"click\", function(e){\n    if(!colorPop.contains(e.target) && e.target!==colorBtn && !colorBtn.contains(e.target)){\n      colorPop.classList.remove(\"open\");\n    }\n  });\n  document.getElementById(\"customColor\").addEventListener(\"input\", function(e){ applyAccent(e.target.value); });\n\n  document.getElementById(\"btnClearItems\").addEventListener(\"click\", function(){\n    if(confirm(\"Remove every item from every section? Section headers stay, so you can start adding fresh items right away.\")){\n      state.categories.forEach(function(cat){ cat.items = []; });\n      renderCategories(); saveState();\n    }\n  });\n\n  document.getElementById(\"btnReset\").addEventListener(\"click\", function(){\n    if(confirm(\"Reset the whole rate list back to the original sample? This cannot be undone.\")){\n      state = defaultState();\n      applyAccent(state.accent);\n      bindHeader();\n      renderCategories();\n      saveState();\n    }\n  });\n\n  // ---------- print sheet ----------\n  // The printed page is drawn from the data (not from the editable screen) at exact\n  // A4 point coordinates, so it always comes out as a clean, fixed layout that\n  // matches the reference rate-list PDF - independent of the browser's own\n  // table/border rounding.\n  var PG = { W:595.2756, H:841, TW:489, BANNER:24, HEAD:17, ROW:17.5, GAP:11,\n             FIRST_TOP:128.5, CONT_TOP:40, BOTTOM:800 };\n  PG.TX = (PG.W - PG.TW) / 2;\n  var COLS_TYPE   = [0,195,283,359,429,489];   // Particulars | Size | Type | Rate | GST\n  var COLS_NOTYPE = [0,271,359,429,489];      // Particulars | Size | Rate | GST\n\n  function n3(n){ return (Math.round(n*1000)/1000).toString(); }\n\n  var _mctx = null;\n  function textW1(str){            // width of the text at 1pt, using the print font\n    try{\n      if(!_mctx){\n        _mctx = document.createElement(\"canvas\").getContext(\"2d\");\n        _mctx.font = '700 100px \"RLM Print\",\"DejaVu Sans\",Verdana,sans-serif';\n        if(\"fontKerning\" in _mctx) _mctx.fontKerning = \"none\";\n      }\n      return _mctx.measureText(str).width / 100;\n    }catch(e){ return 0; }\n  }\n  // Text that is too long for its cell is shrunk to fit instead of spilling over.\n  function fitSize(str, size, maxW){\n    var w = textW1(str) * size;\n    return (w > maxW && w > 0) ? Math.max(4.5, size * maxW / w) : size;\n  }\n  function txt(str, x, y, size, fill, anchor, maxW){\n    if(str === \"\" || str === null || str === undefined) return \"\";\n    str = String(str);\n    size = fitSize(str, size, maxW);\n    return '\u003ctext x=\"'+n3(x)+'\" y=\"'+n3(y)+'\" font-size=\"'+n3(size)+'\" fill=\"'+fill+'\"' +\n           (anchor===\"middle\" ? ' text-anchor=\"middle\"' : '') + '>'+esc(str)+'\u003c/text>';\n  }\n\n  // One table (or one page-worth of a long table) at vertical position y.\n  function drawTable(cat, rows, firstRowIdx, y, accent, tint){\n    var xs = cat.hasType ? COLS_TYPE : COLS_NOTYPE, tx = PG.TX;\n    var gridTop = y + PG.BANNER, bodyTop = gridTop + PG.HEAD;\n    var bottom = bodyTop + rows.length * PG.ROW, height = bottom - y, s = \"\";\n\n    // fills\n    s += '\u003crect x=\"'+n3(tx)+'\" y=\"'+n3(y)+'\" width=\"'+PG.TW+'\" height=\"'+(PG.BANNER+PG.HEAD)+'\" fill=\"'+accent+'\"/>';\n    rows.forEach(function(it, i){\n      if((firstRowIdx + i) % 2 === 1){\n        s += '\u003crect x=\"'+n3(tx)+'\" y=\"'+n3(bodyTop + i*PG.ROW)+'\" width=\"'+PG.TW+'\" height=\"'+PG.ROW+'\" fill=\"'+tint+'\"/>';\n      }\n    });\n\n    // text: banner, column headings, rows\n    s += txt(String(cat.name).toUpperCase(), tx + PG.TW/2, y + 16.5, 11, \"#fff\", \"middle\", PG.TW - 24);\n    var heads = cat.hasType ? [\"PARTICULARS\",\"SIZE\",\"TYPE\",\"RATE\",\"GST\"] : [\"PARTICULARS\",\"SIZE\",\"RATE\",\"GST\"];\n    heads.forEach(function(t, c){\n      s += txt(t, tx + (xs[c]+xs[c+1])/2, gridTop + 11.25, 7.5, \"#fff\", \"middle\", xs[c+1]-xs[c]-8);\n    });\n    rows.forEach(function(it, i){\n      var by = bodyTop + i*PG.ROW + 11.75;\n      var vals = [it.particulars, it.size];\n      if(cat.hasType) vals.push(it.type || \"\");\n      vals.push((it.rate === \"\" || it.rate === null || it.rate === undefined) ? \"\" : \"\\u20B9\" + it.rate);\n      vals.push(it.gst === \"extra\" ? \"EXTRA\" : \"NIL\");\n      var nc = vals.length;\n      vals.forEach(function(v, c){\n        var w = xs[c+1]-xs[c], last2 = c >= nc-2;          // Rate + GST are in the accent colour\n        var fill = last2 ? accent : \"#000\";\n        if(c === 0) s += txt(v, tx + 6, by, 8, fill, \"start\", w - 12);\n        else        s += txt(v, tx + (xs[c]+xs[c+1])/2, by, 8, fill, \"middle\", w - 8);\n      });\n    });\n\n    // grid (0.6pt #333) then outer box (0.8pt black) - same order as the reference\n    var g = \"\";\n    for(var r = 0; r \u003c= rows.length + 1; r++){\n      var gy = r === 0 ? gridTop : (r === 1 ? bodyTop : bodyTop + (r-1)*PG.ROW);\n      g += 'M'+n3(tx)+' '+n3(gy)+'H'+n3(tx+PG.TW);\n    }\n    xs.forEach(function(x){ g += 'M'+n3(tx+x)+' '+n3(gridTop)+'V'+n3(bottom); });\n    s += '\u003cpath d=\"'+g+'\" fill=\"none\" stroke=\"#333\" stroke-width=\"0.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>';\n    s += '\u003crect x=\"'+n3(tx)+'\" y=\"'+n3(y)+'\" width=\"'+PG.TW+'\" height=\"'+n3(height)+'\" fill=\"none\" stroke=\"#000\" stroke-width=\"0.8\" stroke-linejoin=\"round\"/>';\n    return s;\n  }\n\n  function buildPrintSheet(){\n    var accent = state.accent || \"#8b0000\", tint = printTint(accent), sh = state.shop;\n    var pages = [], cur = \"\", y;\n\n    // ----- page 1 header -----\n    cur += txt(sh.name, PG.W/2, 52, 16, accent, \"middle\", PG.W - 80);\n    var by = 52 + 14.5, metas = [];\n    if(sh.address) metas.push(sh.address);\n    var ids = [];\n    if(sh.gstin) ids.push(\"GSTIN : \"+sh.gstin);\n    if(sh.fssai) ids.push(\"FSSAI : \"+sh.fssai);\n    if(ids.length) metas.push(ids.join(\" | \"));\n    if(sh.phone) metas.push(\"Call to Order: \"+sh.phone);\n    metas.forEach(function(m, i){ cur += txt(m, PG.W/2, by + i*10.5, 7.5, \"#000\", \"middle\", PG.W - 80); });\n    var lastBase = metas.length ? by + (metas.length-1)*10.5 : 52;\n    cur += txt(\"RATE LIST\", PG.W/2, lastBase + 28, 13, accent, \"middle\", PG.W - 80);\n    y = lastBase + 28 + 13;                       // first table top (128.5 for the default header)\n\n    function newPage(){ pages.push(cur); cur = \"\"; y = PG.CONT_TOP; }\n\n    // ----- tables, split across pages when they do not fit -----\n    state.categories.forEach(function(cat){\n      var left = cat.items.slice(), done = 0;\n      do{\n        var minH = PG.BANNER + PG.HEAD + (left.length ? PG.ROW : 0);\n        if(y + minH > PG.BOTTOM && (pages.length || cur)) { if(y > PG.CONT_TOP) newPage(); }\n        var avail = PG.BOTTOM - y - PG.BANNER - PG.HEAD;\n        var n = left.length ? Math.max(1, Math.min(left.length, Math.floor(avail / PG.ROW))) : 0;\n        var chunk = left.splice(0, n);\n        cur += drawTable(cat, chunk, done, y, accent, tint);\n        done += chunk.length;\n        y += PG.BANNER + PG.HEAD + chunk.length * PG.ROW + PG.GAP;\n        if(left.length) newPage();\n      }while(left.length);\n    });\n\n    if(state.footer){\n      if(y + 12 > PG.BOTTOM + 30) newPage();\n      cur += txt(state.footer, PG.W/2, y - PG.GAP + 14, 7.5, \"#000\", \"middle\", PG.W - 80);\n    }\n    pages.push(cur);\n\n    var html = pages.map(function(p){\n      return '\u003cdiv class=\"pr-page\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 '+PG.W+' '+PG.H+'\">'+p+'\u003c/svg>\u003c/div>';\n    }).join(\"\");\n    document.getElementById(\"printRoot\").innerHTML = html;\n  }\n\n  var APP_TITLE = document.title;\n  function printTitle(){ return ((state.shop.name || \"Rate List\") + \" - Rate List\").replace(/\\s+/g,\" \").trim(); }\n  function doPrint(){\n    buildPrintSheet();\n    document.title = printTitle();       // the saved PDF's filename comes from the page title\n    window.print();\n  }\n  document.getElementById(\"btnPrint\").addEventListener(\"click\", doPrint);\n  // Also covers Ctrl/Cmd+P and the browser menu.\n  window.addEventListener(\"beforeprint\", function(){ buildPrintSheet(); document.title = printTitle(); });\n  window.addEventListener(\"afterprint\", function(){ document.title = APP_TITLE; });\n  // Load the embedded print font up-front so it is ready when printing.\n  try{ if(document.fonts && document.fonts.load){ document.fonts.load('700 8pt \"RLM Print\"'); } }catch(e){}\n\n  // ---------- PNG export via the downloads capability ----------\n  var downloadsCap = null;\n  (function initCapability(){\n    try{\n      if(window.claude && window.claude.use){\n        window.claude.use(\"downloads\").then(function(cap){ downloadsCap = cap; });\n      }\n    }catch(e){ /* not running in a capability-granting viewer */ }\n  })();\n\n  document.getElementById(\"btnPng\").addEventListener(\"click\", function(){\n    var btn = this;\n    var original = btn.innerHTML;\n    btn.disabled = true; btn.textContent = \"Rendering\u2026\";\n    html2canvas(document.getElementById(\"sheet\"), { backgroundColor: \"#f7f2e9\", scale: 2 }).then(function(canvas){\n      canvas.toBlob(async function(blob){\n        btn.disabled = false; btn.innerHTML = original;\n        if(!blob) return;\n        if(downloadsCap){\n          try{\n            await downloadsCap.save({ filename: \"rate-list.png\", data: blob });\n          }catch(err){\n            fallbackDownload(blob);\n          }\n        } else {\n          fallbackDownload(blob);\n        }\n      }, \"image/png\");\n    }).catch(function(){\n      btn.disabled = false; btn.innerHTML = original;\n      alert(\"Couldn't render the image. Try Print / PDF instead.\");\n    });\n  });\n  function fallbackDownload(blob){\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement(\"a\");\n    a.href = url; a.download = \"rate-list.png\";\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);\n  }\n\n  // ---------- boot ----------\n  applyAccent(state.accent);\n  bindHeader();\n  renderCategories();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"
};
const TITLES = { hotels:'Hotels', roster:'Duty roster', stamp:'Stamp desk', ratelist:'Rate list maker' };
const FRAME_TITLES = { hotels:'Hotel checklist', roster:'Duty roster generator', stamp:'Stamp desk', ratelist:'Rate list maker' };

const menu = document.getElementById('menu');
const tool = document.getElementById('tool');
const toolTitle = document.getElementById('toolTitle');
const backBtn = document.getElementById('back');
const panels = Array.from(document.querySelectorAll('.panel'));
const choices = Array.from(document.querySelectorAll('.choice'));

let pushed = false;   // true when the current tool was opened from the menu (so Back can use browser history)
let lastChoice = null;

function showMenu(){
  tool.hidden = true;
  menu.hidden = false;
  document.title = '🌐SAHANI BASKET 🌐';
  if (lastChoice) lastChoice.focus({ preventScroll: true });
}

function openTool(id){
  menu.hidden = true;
  tool.hidden = false;
  toolTitle.textContent = TITLES[id];
  document.title = TITLES[id] + ' - 🌐SAHANI BASKET 🌐';

  panels.forEach(p => { p.hidden = p.dataset.app !== id; });
  const panel = panels.find(p => p.dataset.app === id);
  let frame = panel.querySelector('iframe');
  if (!frame) {
    frame = document.createElement('iframe');
    frame.title = FRAME_TITLES[id];
    frame.srcdoc = APPS[id];
    panel.appendChild(frame);
  } else {
    try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {}
  }
  if (lastChoice) backBtn.focus({ preventScroll: true });
}

function route(){
  const id = location.hash.slice(1);
  if (APPS[id]) openTool(id); else showMenu();
}

choices.forEach(btn => btn.addEventListener('click', () => {
  lastChoice = btn;
  pushed = true;
  location.hash = btn.dataset.app;      // adds a history entry, then hashchange calls route()
}));

backBtn.addEventListener('click', () => {
  if (pushed) { pushed = false; history.back(); return; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  showMenu();
});

window.addEventListener('hashchange', route);
route();
</script>
<script>
"use strict";
/* Rainforest stream theme: a live, procedural golden-hour scene drawn on a canvas behind the tool menu.
   It only animates while the menu is on screen, and holds still if the device asks for reduced motion. */
(function(){
  const menu = document.getElementById('menu');
  const cv = document.getElementById('theme');
  if (!menu || !cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  const TAU = Math.PI * 2;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mulberry(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const lerp = (a, b, k) => a + (b - a) * k;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

  let W = 0, H = 0, dpr = 1, hy = 0, yb = 0, unit = 0;
  let bg = null, fg = null, mistSprite = null, glowSprite = null, waterPath = null;
  let streaks = [], glints = [], motes = [], mists = [], ferns = [], leaves = [], ripples = [], rays = [];
  let rng = mulberry(7);

  /* ---- stream geometry (perspective: narrow far away at the horizon, wide near the viewer) ---- */
  const tAt = y => clamp01((y - hy) / (yb - hy));
  const cxAt = y => W * 0.5 + Math.sin(tAt(y) * 2.4 + 0.5) * W * 0.055 * (1 - tAt(y) * 0.35);
  const halfAt = y => W * 0.045 + Math.pow(tAt(y), 1.3) * W * 0.42;
  const yFromT = t => hy + Math.pow(t, 1.0) * (yb - hy);

  function mk(w, h){
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  }

  /* ---- drawing helpers ---- */
  function leafPath(c, len, wid){
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(len * 0.45, -wid, len, 0);
    c.quadraticCurveTo(len * 0.45, wid, 0, 0);
  }

  function rock(c, x, y, w, h, r, opts){
    opts = opts || {};
    const n = 12, pts = [];
    for (let i = 0; i < n; i++){
      const a = i / n * TAU, k = 0.8 + r() * 0.24;
      pts.push([x + Math.cos(a) * w * k, y + Math.sin(a) * h * k * (a > Math.PI ? 0.88 : 1)]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    const path = new Path2D();
    let m = mid(pts[n - 1], pts[0]);
    path.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++){
      const m2 = mid(pts[i], pts[(i + 1) % n]);
      path.quadraticCurveTo(pts[i][0], pts[i][1], m2[0], m2[1]);
    }
    path.closePath();

    c.save();
    // contact shadow / wet edge
    c.fillStyle = opts.water ? 'rgba(4,20,18,.45)' : 'rgba(0,0,0,.38)';
    c.beginPath(); c.ellipse(x, y + h * 0.78, w * 1.12, h * 0.3, 0, 0, TAU); c.fill();

    let g = c.createLinearGradient(x + w, y - h, x - w * 0.8, y + h);
    g.addColorStop(0, '#7d8a66'); g.addColorStop(0.35, '#3f4d3c'); g.addColorStop(1, '#0f1a13');
    c.fillStyle = g; c.fill(path);

    c.save(); c.clip(path);
    // moss cap
    g = c.createLinearGradient(x, y - h, x, y + h * 0.4);
    g.addColorStop(0, 'rgba(150,196,70,.95)'); g.addColorStop(0.55, 'rgba(70,120,40,.75)'); g.addColorStop(1, 'rgba(30,70,30,0)');
    c.fillStyle = g; c.fillRect(x - w * 1.3, y - h * 1.3, w * 2.6, h * 1.9);
    for (let k = 0; k < 16; k++){
      const bx = x + (r() - 0.5) * w * 1.7, by = y - h * (0.05 + r() * 0.95), s = w * (0.1 + r() * 0.22);
      c.fillStyle = 'rgba(' + (90 + r() * 60 | 0) + ',' + (150 + r() * 50 | 0) + ',' + (40 + r() * 30 | 0) + ',' + (0.4 + r() * 0.4) + ')';
      c.beginPath(); c.ellipse(bx, by, s, s * 0.6, r() * TAU, 0, TAU); c.fill();
    }
    // lower shade
    g = c.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,10,6,.6)');
    c.fillStyle = g; c.fillRect(x - w * 1.3, y, w * 2.6, h * 1.3);
    c.restore();

    // golden rim light from the upper right
    g = c.createLinearGradient(x + w, y - h, x - w * 0.2, y + h * 0.3);
    g.addColorStop(0, 'rgba(255,224,140,.75)'); g.addColorStop(0.5, 'rgba(255,224,140,.12)'); g.addColorStop(1, 'rgba(255,224,140,0)');
    c.strokeStyle = g; c.lineWidth = Math.max(1, w * 0.035); c.stroke(path);

    if (opts.water){
      // gentle foam where the stream parts around the stone
      g = c.createRadialGradient(x, y + h * 0.8, w * 0.2, x, y + h * 0.8, w * 1.4);
      g.addColorStop(0, 'rgba(235,245,225,.30)'); g.addColorStop(1, 'rgba(235,245,225,0)');
      c.fillStyle = g; c.beginPath(); c.ellipse(x, y + h * 0.85, w * 1.5, h * 0.45, 0, 0, TAU); c.fill();
    }
    c.restore();
  }

  function trunk(c, x, w, top, bottom, lean, dark, light){
    const g = c.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, dark); g.addColorStop(0.62, dark); g.addColorStop(0.9, light); g.addColorStop(1, dark);
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(x - w * 0.5 + lean, top);
    c.lineTo(x + w * 0.5 + lean, top);
    c.lineTo(x + w * 0.62, bottom);
    c.lineTo(x - w * 0.62, bottom);
    c.closePath(); c.fill();
  }

  /* ---- static layers, rebuilt only on resize ---- */
  function buildBackground(){
    bg = mk(W * dpr, H * dpr);
    const c = bg.getContext('2d');
    c.scale(dpr, dpr);
    const r = mulberry(11);

    // base: shadowed canopy above, sunlit haze at the far end of the stream
    let g = c.createLinearGradient(0, 0, 0, hy + 20);
    g.addColorStop(0, '#04110a'); g.addColorStop(0.28, '#0d2a17'); g.addColorStop(0.5, '#2b5a2a');
    g.addColorStop(0.8, '#7f9a42'); g.addColorStop(1, '#d6c774');
    c.fillStyle = g; c.fillRect(0, 0, W, hy + 20);

    // sun bloom high on the right
    g = c.createRadialGradient(W * 0.72, H * 0.02, 0, W * 0.72, H * 0.02, H * 0.6);
    g.addColorStop(0, 'rgba(255,226,140,.78)'); g.addColorStop(0.35, 'rgba(255,200,100,.28)'); g.addColorStop(1, 'rgba(255,190,90,0)');
    c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over';

    // distant trunks, softened by haze
    for (let i = 0; i < 16; i++){
      const x = r() * W, w = unit * (0.012 + r() * 0.03), far = r();
      trunk(c, x, w, -10, hy + 6, (r() - 0.5) * 8, 'rgba(14,38,22,' + (0.35 + far * 0.4) + ')', 'rgba(210,190,110,' + (0.12 + far * 0.12) + ')');
    }
    g = c.createLinearGradient(0, hy - H * 0.22, 0, hy + 10);
    g.addColorStop(0, 'rgba(210,205,120,0)'); g.addColorStop(1, 'rgba(226,214,130,.5)');
    c.fillStyle = g; c.fillRect(0, hy - H * 0.22, W, H * 0.22 + 12);

    // far foliage wall around where the stream vanishes
    for (let i = 0; i < 90; i++){
      const side = r() < 0.5 ? -1 : 1;
      const x = W * 0.5 + side * (W * 0.05 + Math.pow(r(), 0.8) * W * 0.6);
      const y = hy - H * 0.16 * Math.pow(r(), 1.3) + 6;
      const s = unit * (0.05 + r() * 0.12);
      c.fillStyle = 'hsla(' + (85 + r() * 40 | 0) + ',' + (40 + r() * 25 | 0) + '%,' + (11 + r() * 15 | 0) + '%,' + (0.55 + r() * 0.4) + ')';
      c.beginPath(); c.ellipse(x, y, s, s * 0.6, r() * 0.6 - 0.3, 0, TAU); c.fill();
    }

    // ground banks
    g = c.createLinearGradient(0, hy - 6, 0, H);
    g.addColorStop(0, '#294a20'); g.addColorStop(0.35, '#16321a'); g.addColorStop(1, '#07130b');
    c.fillStyle = g; c.fillRect(0, hy - 6, W, H - hy + 6);
    for (let i = 0; i < 220; i++){
      const t = Math.pow(r(), 1.4), y = hy + t * (yb - hy), x = r() * W, s = unit * (0.02 + t * 0.09) * (0.5 + r());
      c.fillStyle = 'hsla(' + (90 + r() * 40 | 0) + ',' + (40 + r() * 30 | 0) + '%,' + (12 + r() * 18 | 0) + '%,' + (0.4 + r() * 0.4) + ')';
      c.beginPath(); c.ellipse(x, y, s, s * 0.5, 0, 0, TAU); c.fill();
    }

    // water body
    c.save(); c.clip(waterPath);
    g = c.createLinearGradient(0, hy, 0, yb);
    g.addColorStop(0, '#f4de92'); g.addColorStop(0.1, '#c9cf82'); g.addColorStop(0.3, '#5b9773');
    g.addColorStop(0.6, '#1c5a52'); g.addColorStop(1, '#092c2c');
    c.fillStyle = g; c.fillRect(0, hy - 4, W, H - hy + 8);
    // reflections of the canopy and of the light shafts
    for (let i = 0; i < 46; i++){
      const t = 0.05 + r() * 0.95, y = yFromT(t), x = cxAt(y) + (r() - 0.5) * 2 * halfAt(y);
      const hh = (yb - hy) * (0.05 + r() * 0.14) * (0.4 + t), ww = unit * (0.008 + r() * 0.03) * (0.4 + t * 1.6);
      const gold = r() < 0.4;
      c.fillStyle = gold ? 'rgba(255,224,140,' + (0.05 + r() * 0.1) + ')' : 'rgba(4,28,16,' + (0.12 + r() * 0.2) + ')';
      c.beginPath(); c.ellipse(x, y, ww, hh, 0, 0, TAU); c.fill();
    }
    c.restore();

    // glow where the water meets the light
    g = c.createRadialGradient(cxAt(hy), hy, 0, cxAt(hy), hy, W * 0.55);
    g.addColorStop(0, 'rgba(255,232,150,.6)'); g.addColorStop(1, 'rgba(255,220,130,0)');
    c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'source-over';

    // near ancient trunks at the sides, rooted in the banks
    trunk(c, W * 0.035, W * 0.15, -10, hy + H * 0.34, 3, '#07140c', 'rgba(232,196,110,.5)');
    trunk(c, W * 0.965, W * 0.12, -10, hy + H * 0.3, -3, '#07140c', 'rgba(232,196,110,.65)');
    // moss streaks on the trunks
    for (let i = 0; i < 40; i++){
      const side = i % 2 ? 1 : -1, x = side < 0 ? W * (0.0 + r() * 0.07) : W * (0.94 + r() * 0.06), y = r() * (hy + H * 0.3);
      c.fillStyle = 'rgba(' + (60 + r() * 30 | 0) + ',' + (110 + r() * 40 | 0) + ',40,' + (0.2 + r() * 0.3) + ')';
      c.beginPath(); c.ellipse(x, y, unit * 0.012, unit * (0.04 + r() * 0.08), 0, 0, TAU); c.fill();
    }

    // canopy: three passes, back to front, darkest and densest at the top
    for (let pass = 0; pass < 3; pass++){
      const count = 150 - pass * 30;
      for (let i = 0; i < count; i++){
        const x = r() * W * 1.1 - W * 0.05, y = Math.pow(r(), 1.7) * H * (0.3 - pass * 0.03) - 6;
        const len = unit * (0.07 + r() * 0.13) * (1 + pass * 0.25), ang = r() * TAU;
        const lit = r() < 0.12 + pass * 0.04 && x > W * 0.3;
        const l = lit ? 42 + r() * 14 : (7 + pass * 3) + r() * 15 + (1 - Math.min(1, y / (H * 0.3))) * -3;
        c.save(); c.translate(x, y); c.rotate(ang);
        c.fillStyle = lit ? 'hsla(' + (56 + r() * 18 | 0) + ',72%,' + l + '%,.78)' : 'hsl(' + (95 + r() * 45 | 0) + ',' + (45 + r() * 20 | 0) + '%,' + l + '%)';
        leafPath(c, len, len * (0.22 + r() * 0.14)); c.fill();
        if (pass === 2 && r() < 0.5){ c.strokeStyle = 'rgba(255,225,140,.35)'; c.lineWidth = 0.8; c.beginPath(); c.moveTo(0, 0); c.lineTo(len * 0.9, 0); c.stroke(); }
        c.restore();
      }
    }
    // hanging vines
    for (let i = 0; i < 9; i++){
      const x = r() * W, len = H * (0.1 + r() * 0.22), sw = (r() - 0.5) * unit * 0.12;
      c.strokeStyle = 'rgba(10,32,16,.85)'; c.lineWidth = 1.2 + r() * 1.4;
      c.beginPath(); c.moveTo(x, 0); c.bezierCurveTo(x + sw, len * 0.3, x - sw, len * 0.7, x + sw * 0.4, len); c.stroke();
      for (let k = 1; k < 7; k++){
        const yy = len * k / 7, xx = x + Math.sin(k) * sw * 0.4;
        c.save(); c.translate(xx, yy); c.rotate((k % 2 ? 0.7 : 2.4) + r() * 0.4);
        c.fillStyle = 'hsl(' + (100 + r() * 30 | 0) + ',50%,' + (16 + r() * 12 | 0) + '%)';
        leafPath(c, unit * 0.045, unit * 0.014); c.fill(); c.restore();
      }
    }
  }

  function buildForeground(){
    fg = mk(W * dpr, H * dpr);
    const c = fg.getContext('2d');
    c.scale(dpr, dpr);
    const r = mulberry(23);
    const items = [];
    // bank stones, both sides
    for (let side = -1; side <= 1; side += 2){
      for (let i = 0; i < 8; i++){
        const t = 0.06 + i * 0.125 + r() * 0.05, y = yFromT(t);
        const x = cxAt(y) + side * (halfAt(y) + (r() - 0.35) * unit * 0.03 * (0.5 + t));
        const s = unit * (0.03 + t * 0.095) * (0.7 + r() * 0.6);
        items.push({ x: x, y: y, w: s, h: s * (0.55 + r() * 0.2), t: t });
      }
    }
    // stones standing in the water
    [[0.24, -0.35], [0.42, 0.42], [0.6, -0.12], [0.78, 0.3]].forEach(function(p){
      const y = yFromT(p[0]), x = cxAt(y) + p[1] * halfAt(y);
      const s = unit * (0.03 + p[0] * 0.09);
      items.push({ x: x, y: y, w: s, h: s * 0.6, t: p[0], water: true });
    });
    items.sort((a, b) => a.t - b.t);
    items.forEach(it => rock(c, it.x, it.y, it.w, it.h, r, { water: it.water }));
    // big cropped stones in the corners to frame the scene
    rock(c, W * 0.0, H * 1.0, W * 0.34, H * 0.1, r);
    rock(c, W * 1.0, H * 1.01, W * 0.36, H * 0.11, r);
  }

  function buildSprites(){
    mistSprite = mk(256, 128);
    let c = mistSprite.getContext('2d');
    let g = c.createRadialGradient(128, 64, 0, 128, 64, 128);
    g.addColorStop(0, 'rgba(232,244,226,.55)'); g.addColorStop(0.5, 'rgba(220,238,216,.22)'); g.addColorStop(1, 'rgba(220,238,216,0)');
    c.setTransform(1, 0, 0, 0.5, 0, 32); c.fillStyle = g; c.fillRect(0, -64, 256, 256);

    glowSprite = mk(64, 64);
    c = glowSprite.getContext('2d');
    g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,246,206,1)'); g.addColorStop(0.25, 'rgba(255,226,140,.55)'); g.addColorStop(1, 'rgba(255,214,120,0)');
    c.fillStyle = g; c.fillRect(0, 0, 64, 64);
  }

  /* ---- animated things ---- */
  function buildActors(){
    const r = mulberry(5);
    streaks = []; glints = []; motes = []; mists = []; ferns = []; leaves = []; ripples = []; rays = [];

    for (let i = 0; i < 110; i++) streaks.push({ u: (r() - 0.5) * 1.9, v: r(), sp: 0.018 + r() * 0.03, len: 0.5 + r() * 1.2, ph: r() * TAU, gold: r() < 0.55 });
    for (let i = 0; i < 46; i++) glints.push({ t: 0.03 + Math.pow(r(), 1.1) * 0.95, u: (r() - 0.5) * 1.8, f: 0.5 + r() * 1.4, ph: r() * TAU });
    for (let i = 0; i < 36; i++) motes.push({ x: r() * W, y: r() * H * 0.8, vy: 3 + r() * 6, sw: 6 + r() * 14, f: 0.3 + r() * 0.8, ph: r() * TAU, s: 0.6 + r() * 1.4 });
    for (let i = 0; i < 9; i++) mists.push({ x: r() * (W + 500) - 250, y: hy - H * 0.04 + r() * H * 0.3, sp: 4 + r() * 8, w: W * (0.7 + r() * 0.8), a: 0.1 + r() * 0.14, ph: r() * TAU });
    for (let i = 0; i < 6; i++) rays.push({ x: W * (0.32 + i * 0.13) + (r() - 0.5) * W * 0.06, w: unit * (0.05 + r() * 0.09), f: 0.15 + r() * 0.2, ph: r() * TAU, a: 0.1 + r() * 0.1 });

    // fern clumps: [x, y, scale, fronds, dark?]
    const spots = [
      [-0.02, 1.03, 2.1, 9, true], [1.02, 1.03, 2.3, 9, true],
      [0.07, 0.94, 1.15, 8, false], [0.93, 0.95, 1.2, 8, false]
    ];
    [[0.3, -1], [0.5, 1], [0.15, -1], [0.7, 1]].forEach(function(p, i){
      const y = yFromT(p[0]);
      spots.push([(cxAt(y) + p[1] * (halfAt(y) + unit * 0.03 * (1 + p[0]))) / W, y / H, 0.35 + p[0] * 0.9, 6, false]);
    });
    spots.sort((a, b) => a[1] - b[1]);
    spots.forEach(function(s){
      const fr = [];
      for (let k = 0; k < s[3]; k++){
        const a = (k / (s[3] - 1) - 0.5) * 2.1 + (r() - 0.5) * 0.25;
        fr.push({ a: a, dir: a === 0 ? 1 : (a > 0 ? 1 : -1), L: unit * 0.24 * (0.75 + r() * 0.5), ph: r() * TAU, sh: r() });
      }
      ferns.push({ x: s[0] * W, y: s[1] * H, s: s[2], dark: s[4], fr: fr });
    });

    for (let i = 0; i < 9; i++) leaves.push(newLeaf(r, true));
  }

  function newLeaf(r, initial){
    const t = 0.12 + r() * 0.8, ly = yFromT(t), lx = cxAt(ly) + (r() - 0.5) * 1.6 * halfAt(ly);
    const pal = ['#e2b23f', '#cf8a2c', '#98b23c', '#bdc94e', '#dd7c2a', '#78a03a'];
    const fall = 5 + r() * 4;
    return {
      lx: lx, ly: ly, x0: lx + (r() - 0.5) * W * 0.3, fall: fall, age: initial ? r() * fall : 0,
      size: unit * (0.016 + t * 0.03), col: pal[r() * pal.length | 0], rot: r() * TAU, spin: (r() - 0.5) * 3,
      ph: r() * TAU, landed: false, t: t
    };
  }

  /* ---- fern frond ---- */
  function frond(c, x0, y0, f, s, T, dark){
    const N = 20, L = f.L * s, step = L / N;
    const sway = Math.sin(T * 0.7 + f.ph) * 0.07 + Math.sin(T * 1.7 + f.ph * 2.3) * 0.025;
    const xs = [x0], ys = [y0], as = [f.a];
    let x = x0, y = y0;
    for (let k = 1; k <= N; k++){
      const p = k / N, ang = f.a + f.dir * 1.25 * Math.pow(p, 1.7) + sway * (0.25 + p * 1.5);
      x += Math.sin(ang) * step; y -= Math.cos(ang) * step;
      xs.push(x); ys.push(y); as.push(ang);
    }
    const lm = L * 0.2;
    const col = dark ? 'hsl(120,45%,' + (7 + f.sh * 6) + '%)' : 'hsl(' + (100 + f.sh * 22 | 0) + ',52%,' + (16 + f.sh * 14) + '%)';
    const pth = new Path2D();
    pth.moveTo(xs[0], ys[0]);
    for (let k = 1; k <= N; k++) pth.lineTo(xs[k], ys[k]);
    for (let k = 2; k <= N; k++){
      const p = k / N, ll = lm * Math.pow(Math.sin(Math.PI * (0.12 + 0.88 * p)), 0.9) * (1 - 0.5 * p);
      for (let sd = -1; sd <= 1; sd += 2){
        const la = as[k] + sd * 1.15;
        pth.moveTo(xs[k], ys[k]);
        pth.lineTo(xs[k] + Math.sin(la) * ll, ys[k] - Math.cos(la) * ll + ll * 0.3);
      }
    }
    c.strokeStyle = col; c.lineWidth = Math.max(1.2, unit * 0.005 * s); c.stroke(pth);
    if (!dark && s > 0.9){
      c.save(); c.translate(0.8, -0.9);
      c.strokeStyle = 'rgba(255,226,140,.3)'; c.lineWidth = 0.8; c.stroke(pth);
      c.restore();
    }
  }

  /* ---- one frame ---- */
  function draw(T){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0, W, H);

    // flowing streaks and glints on the water
    ctx.save(); ctx.clip(waterPath);
    ctx.lineCap = 'round';
    for (let i = 0; i < streaks.length; i++){
      const s = streaks[i];
      const v = (s.v + T * s.sp) % 1, t = Math.pow(v, 1.7);
      const y = hy + 4 + t * (yb - hy - 4), x = cxAt(y) + s.u * halfAt(y) * 0.96 + Math.sin(T * 0.5 + s.ph) * (1 + t * 5);
      const len = unit * (0.008 + t * 0.075) * s.len, a = Math.sin(v * Math.PI) * (0.25 + 0.2 * Math.sin(T * 1.4 + s.ph));
      if (a <= 0.01) continue;
      ctx.strokeStyle = s.gold ? 'rgba(255,238,170,' + a + ')' : 'rgba(210,240,225,' + a * 0.8 + ')';
      ctx.lineWidth = 0.6 + t * 2.2;
      ctx.beginPath(); ctx.moveTo(x - len, y); ctx.quadraticCurveTo(x, y - 0.6 - t * 1.6, x + len, y); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < glints.length; i++){
      const g = glints[i], y = yFromT(g.t), x = cxAt(y) + g.u * halfAt(y) * 0.95;
      const a = Math.pow(Math.max(0, Math.sin(T * g.f + g.ph)), 5);
      if (a < 0.03) continue;
      const sz = unit * (0.02 + g.t * 0.05);
      ctx.globalAlpha = a; ctx.drawImage(glowSprite, x - sz, y - sz * 0.6, sz * 2, sz * 1.2);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // ripples where leaves touched the water
    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i], k = (T - rp.t0) / rp.life;
      if (k < 0) continue;
      if (k >= 1){ ripples.splice(i, 1); continue; }
      const rad = rp.max * (1 - Math.pow(1 - k, 2));
      ctx.strokeStyle = 'rgba(255,244,205,' + (0.55 * (1 - k)) + ')';
      ctx.lineWidth = 1.3 * (1 - k * 0.5);
      ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rad, rad * 0.3, 0, 0, TAU); ctx.stroke();
    }

    ctx.drawImage(fg, 0, 0, W, H);

    // drifting mist
    for (let i = 0; i < mists.length; i++){
      const m = mists[i], span = W + m.w * 2;
      const x = ((m.x + T * m.sp) % span + span) % span - m.w;
      ctx.globalAlpha = m.a * (0.75 + 0.25 * Math.sin(T * 0.3 + m.ph));
      ctx.drawImage(mistSprite, x, m.y + Math.sin(T * 0.2 + m.ph) * 5, m.w, m.w * 0.42);
    }
    ctx.globalAlpha = 1;

    // swaying ferns
    ctx.lineCap = 'round';
    for (let i = 0; i < ferns.length; i++){
      const f = ferns[i];
      for (let k = 0; k < f.fr.length; k++) frond(ctx, f.x, f.y, f.fr[k], f.s, T, f.dark);
    }

    // falling leaves
    for (let i = 0; i < leaves.length; i++){
      let l = leaves[i];
      const p = l.age / l.fall;
      let x, y, sx = 1, sy = 1, alpha = 1, rot = l.rot + l.age * l.spin;
      if (p < 1){
        y = lerp(-H * 0.05, l.ly, Math.pow(p, 1.08));
        x = lerp(l.x0, l.lx, p) + Math.sin(p * TAU * 2.3 + l.ph) * W * 0.028 * (1 - p * 0.4);
        sx = Math.cos(l.age * 2.2 + l.ph); sy = 1;
        rot = Math.sin(l.age * 1.6 + l.ph) * 0.9 + l.rot;
      } else {
        const f = l.age - l.fall;
        if (!l.landed){
          l.landed = true;
          ripples.push({ x: l.lx, y: l.ly, t0: T, life: 2.4, max: l.size * 3.4 });
          ripples.push({ x: l.lx, y: l.ly, t0: T + 0.3, life: 2.4, max: l.size * 2.2 });
        }
        x = l.lx + f * unit * 0.006; y = l.ly + f * unit * 0.012 * (0.4 + l.t);
        sy = 0.35; alpha = clamp01(1 - (f - 1.8) / 1.6);
        if (f > 3.4){ leaves[i] = newLeaf(rng, false); continue; }
      }
      ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(Math.abs(sx) < 0.15 ? 0.15 : sx, sy);
      ctx.translate(-l.size, 0); ctx.fillStyle = l.col; leafPath(ctx, l.size * 2, l.size * 0.9); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,180,.4)'; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(l.size * 1.9, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // light shafts and floating motes
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < rays.length; i++){
      const r = rays[i], a = r.a * (0.55 + 0.45 * Math.sin(T * r.f + r.ph));
      const sway = Math.sin(T * 0.12 + r.ph) * unit * 0.02;
      const x0 = r.x + sway, drift = -H * 0.42, len = H * 0.9;
      const g = ctx.createLinearGradient(x0, 0, x0 + drift, len);
      g.addColorStop(0, 'rgba(255,228,150,' + a + ')'); g.addColorStop(0.6, 'rgba(255,220,130,' + a * 0.35 + ')'); g.addColorStop(1, 'rgba(255,220,130,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(x0, -10); ctx.lineTo(x0 + r.w, -10);
      ctx.lineTo(x0 + drift + r.w * 3, len); ctx.lineTo(x0 + drift - r.w * 0.5, len);
      ctx.closePath(); ctx.fill();
    }
    for (let i = 0; i < motes.length; i++){
      const m = motes[i];
      const y = ((m.y - T * m.vy) % (H * 0.85) + H * 0.85) % (H * 0.85), x = m.x + Math.sin(T * m.f + m.ph) * m.sw;
      const a = 0.25 + 0.5 * Math.pow(Math.max(0, Math.sin(T * m.f * 1.7 + m.ph)), 2);
      ctx.globalAlpha = a; const sz = 3 * m.s * (unit / 400 + 0.5);
      ctx.drawImage(glowSprite, x - sz, y - sz, sz * 2, sz * 2);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    // vignette + soft scrim so the menu stays readable
    const v = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.25, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(2,10,5,0)'); v.addColorStop(1, 'rgba(2,10,5,.55)');
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(3,14,8,.22)'; ctx.fillRect(0, 0, W, H);
  }

  /* ---- loop ---- */
  let raf = 0, last = 0, T = 0;
  function tick(dt){
    for (let i = 0; i < leaves.length; i++) leaves[i].age += dt;
  }
  function frame(ts){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
    last = ts; T += dt;
    tick(dt); draw(T);
  }
  function start(){
    if (reduce || raf || menu.hidden || document.hidden || !bg) return;
    last = performance.now(); raf = requestAnimationFrame(frame);
  }
  function stop(){ if (raf) cancelAnimationFrame(raf); raf = 0; }

  function build(){
    const nw = window.innerWidth, nh = window.innerHeight;
    if (!nw || !nh) return;
    W = nw; H = nh;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    unit = Math.min(W, H * 0.5);
    hy = H * 0.55; yb = H * 1.02;

    waterPath = new Path2D();
    const steps = 28;
    for (let i = 0; i <= steps; i++){
      const y = hy + (yb - hy) * i / steps, x = cxAt(y) - halfAt(y) + Math.sin(y * 0.045) * 3 * tAt(y);
      i ? waterPath.lineTo(x, y) : waterPath.moveTo(x, y);
    }
    for (let i = steps; i >= 0; i--){
      const y = hy + (yb - hy) * i / steps, x = cxAt(y) + halfAt(y) + Math.sin(y * 0.05 + 2) * 3 * tAt(y);
      waterPath.lineTo(x, y);
    }
    waterPath.closePath();

    buildSprites(); buildBackground(); buildForeground(); buildActors();
    if (reduce){ T = 6; leaves.forEach(l => { l.age = l.fall * 0.5; }); draw(T); }
    else { stop(); start(); }
  }

  let rz = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rz);
    rz = setTimeout(function(){
      if (Math.abs(window.innerWidth - W) > 2 || Math.abs(window.innerHeight - H) > 60) build();
    }, 200);
  });
  document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });
  new MutationObserver(function(){ menu.hidden ? stop() : (bg && Math.abs(window.innerWidth - W) > 2 ? build() : start()); })
    .observe(menu, { attributes: true, attributeFilter: ['hidden'] });

  build();
})();
</script>

<script>
(function(){document.querySelectorAll('.choice').forEach(function(c){c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');});});})();
</script>
